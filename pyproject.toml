[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sbomfuzz"
version = "0.1.0"
description = "Fuzz the components of a CycloneDX SBOM: Claude writes the harnesses, the fuzzers do the rest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "packageurl-python>=0.17",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sbomfuzz = "sbomfuzz.cli:main"

[tool.setuptools]
packages = ["sbomfuzz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real fuzzers; needs the toolchain from the Docker image"]
