[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sbomfuzz"
version = "0.1.0"
description = "AI-assisted fuzz testing of the components listed in a CycloneDX SBOM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13,<2",
    "packageurl-python>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sbomfuzz = "sbomfuzz.cli:main"

[tool.setuptools]
packages = ["sbomfuzz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real fuzzers; needs the toolchain from the Docker image"]
